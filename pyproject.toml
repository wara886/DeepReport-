[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight-multiagent"
version = "0.1.0"
description = "Evidence-driven multi-agent financial research report workbench."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pillow>=10.3.0",
  "pandas>=2.2.2",
  "PyYAML>=6.0.1",
  "pyarrow>=16.1.0",
  "SQLAlchemy>=2.0.36",
  "yfinance>=0.2.43",
  "baostock>=0.9.3",
  "tushare>=1.4.21",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "reportlab>=4.2,<5",
  # Keep the runtime compatible with the repository's LangChain 0.2 integration.
  "langgraph>=0.2.76,<0.3.0",
  "langgraph-checkpoint-sqlite>=2.0.11,<3.0.0",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.45.0",
]
local_rag = [
  "chromadb>=0.5.5",
  "grpcio>=1.63.2",
  "sentence-transformers>=3.0.1",
  "socksio>=1.0.0",
]
pdf = [
  "PyMuPDF>=1.23.8",
  "pdfplumber>=0.11.0",
  "pypdf>=5,<6",
]
docx = [
  "python-docx>=1.1.2",
]
postgres = [
  "psycopg[binary]>=3.2.0",
]
