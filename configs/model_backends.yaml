agent_model:
  provider: deepseek
  mode: openai_compatible_chat
  model_name: deepseek-v4-flash
  model_name_env: DEEPSEEK_MODEL
  base_url: https://api.deepseek.com
  base_url_env: DEEPSEEK_BASE_URL
  api_key: ""
  api_key_env: DEEPSEEK_API_KEY
  max_tokens: 4096
  max_tokens_env: DEEPSEEK_MAX_TOKENS
  temperature: 0.2
  temperature_env: DEEPSEEK_TEMPERATURE
  timeout: 30
  retry: 1

flash_long_model:
  provider: deepseek
  mode: openai_compatible_chat
  model_name: deepseek-v4-flash
  model_name_env: DEEPSEEK_FLASH_LONG_MODEL
  base_url: https://api.deepseek.com
  base_url_env: DEEPSEEK_BASE_URL
  api_key: ""
  api_key_env: DEEPSEEK_API_KEY
  max_tokens: 4096
  max_tokens_env: DEEPSEEK_FLASH_LONG_MAX_TOKENS
  temperature: 0.2
  temperature_env: DEEPSEEK_FLASH_LONG_TEMPERATURE
  timeout: 60
  retry: 1

pro_judge_model:
  provider: deepseek
  mode: openai_compatible_chat
  model_name: deepseek-v4-pro
  model_name_env: DEEPSEEK_PRO_JUDGE_MODEL
  base_url: https://api.deepseek.com
  base_url_env: DEEPSEEK_BASE_URL
  api_key: ""
  api_key_env: DEEPSEEK_API_KEY
  max_tokens: 4096
  max_tokens_env: DEEPSEEK_PRO_JUDGE_MAX_TOKENS
  temperature: 0.1
  temperature_env: DEEPSEEK_PRO_JUDGE_TEMPERATURE
  timeout: 90
  retry: 1

pro_refiner_model:
  provider: deepseek
  mode: openai_compatible_chat
  model_name: deepseek-v4-pro
  model_name_env: DEEPSEEK_PRO_REFINER_MODEL
  base_url: https://api.deepseek.com
  base_url_env: DEEPSEEK_BASE_URL
  api_key: ""
  api_key_env: DEEPSEEK_API_KEY
  max_tokens: 4096
  max_tokens_env: DEEPSEEK_PRO_REFINER_MAX_TOKENS
  temperature: 0.1
  temperature_env: DEEPSEEK_PRO_REFINER_TEMPERATURE
  timeout: 120
  retry: 1

model_routing:
  default_chain: flash
  pro_policy: conditional
  timeout_policy:
    flash_default_timeout_sec: 30
    flash_long_timeout_sec: 60
    pro_judge_timeout_sec: 90
    pro_refiner_timeout_sec: 120
    external_api_timeout_isolated: true
  pro_triggers:
    - verifier_fail
    - evidence_gap
    - valuation_formula_error
    - multimodal_conflict
    - entity_or_period_mismatch
  pro_roles:
    - final_answer_rework
    - verifier_recheck

writer_backend:
  mode: template_only  # template_only | mock | remote | local_small
  common:
    timeout: 10
    retry: 1
    max_tokens: 512
    temperature: 0.2
  backends:
    mock:
      model_name: mock-writer
    remote:
      model_name: ""
      model_name_env: WRITER_REMOTE_MODEL
      base_url: ""
      base_url_env: WRITER_REMOTE_BASE_URL
      api_key: ""
      api_key_env: WRITER_REMOTE_API_KEY
    local_small:
      model_name: tiny-local
