agent_model:
  provider: deepseek
  mode: openai_compatible_chat
  model_name: deepseek-v4-flash
  model_name_env: DEEPSEEK_MODEL
  base_url: https://api.deepseek.com
  base_url_env: DEEPSEEK_BASE_URL
  api_key: ""
  api_key_env: DEEPSEEK_API_KEY
  max_tokens: 4096
  max_tokens_env: DEEPSEEK_MAX_TOKENS
  temperature: 0.2
  temperature_env: DEEPSEEK_TEMPERATURE
  timeout: 120
  retry: 2

model_profiles:
  flash:
    provider: deepseek
    mode: openai_compatible_chat
    model_name: deepseek-v4-flash
    model_name_env: DEEPSEEK_MODEL
    base_url: https://api.deepseek.com
    base_url_env: DEEPSEEK_BASE_URL
    api_key: ""
    api_key_env: DEEPSEEK_API_KEY
    max_tokens: 4096
    max_tokens_env: DEEPSEEK_MAX_TOKENS
    temperature: 0.2
    temperature_env: DEEPSEEK_TEMPERATURE
    timeout: 60
    retry: 2
  pro:
    provider: deepseek
    mode: openai_compatible_chat
    model_name: deepseek-v4-pro
    model_name_env: DEEPSEEK_PRO_MODEL
    base_url: https://api.deepseek.com
    base_url_env: DEEPSEEK_BASE_URL
    api_key: ""
    api_key_env: DEEPSEEK_API_KEY
    max_tokens: 4096
    max_tokens_env: DEEPSEEK_MAX_TOKENS
    temperature: 0.2
    temperature_env: DEEPSEEK_TEMPERATURE
    timeout: 180
    retry: 2

agent_model_routes:
  defaults:
    preview: flash
    delivery: flash
  chat:
    preview: flash
    delivery: flash
  task_parser:
    preview: flash
    delivery: flash
  planning:
    preview: flash
    delivery: flash
  research:
    preview: flash
    delivery: flash
  browser:
    preview: flash
    delivery: flash
  deep_analyze:
    preview: flash
    delivery: pro
  final_answer:
    preview: flash
    delivery: pro
  verifier:
    preview: flash
    delivery: pro
  llm_report_review:
    preview: flash
    delivery: pro

writer_backend:
  mode: template_only  # template_only | mock | remote | local_small
  common:
    timeout: 10
    retry: 1
    max_tokens: 512
    temperature: 0.2
  backends:
    mock:
      model_name: mock-writer
    remote:
      model_name: ""
      model_name_env: WRITER_REMOTE_MODEL
      base_url: ""
      base_url_env: WRITER_REMOTE_BASE_URL
      api_key: ""
      api_key_env: WRITER_REMOTE_API_KEY
    local_small:
      model_name: tiny-local
